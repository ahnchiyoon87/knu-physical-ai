[project]
name = "equipment-assistant"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "psycopg[binary,pool]==3.3.5",
  "pgvector==0.5.0", "pydantic==2.13.5", "PyYAML==6.0.3",
  "httpx==0.28.1", "sqlglot==30.18.0", "neo4j==6.3.0",
  "langgraph==1.2.11", "langgraph-checkpoint-postgres==3.1.2", "mcp==2.2.0",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
models = ["pandas==3.0.5", "scikit-learn==1.9.1", "pyod==3.6.5", "chronos-forecasting==2.3.2", "anomalib==2.6.2"]
documents = ["sentence-transformers==6.0.1", "docling==2.126.0"]
evaluation = ["ragas==0.4.3", "deepeval==4.2.2", "langchain-community==0.4.1"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
