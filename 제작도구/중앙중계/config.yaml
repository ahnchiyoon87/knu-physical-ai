# Provider models are registered only after endpoint/model ID verification.
model_list: []
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: false
litellm_settings:
  turn_off_message_logging: true
  request_timeout: 300
router_settings:
  num_retries: 0
