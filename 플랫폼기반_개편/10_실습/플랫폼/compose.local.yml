# 개인 PC 전용. 원천 docker-compose.yml과 합치지 않고 이 파일 단독 사용.
name: knu-hydops-local
x-runtime: &runtime
  HYDOPS_PG_DSN: postgresql://hydops:hydops@postgres:5432/hydops
  LAB_PG_DSN: postgresql://hydops:hydops@postgres:5432/hydops
  HYDOPS_NEO4J_URI: bolt://neo4j:7687
  LAB_NEO4J_URI: bolt://neo4j:7687
  HYDOPS_API: http://hydops-api:8800
  PLATFORM_INTERNAL_URL: http://lab-platform:8910
  BOOTSTRAP_PLATFORM_URL: http://lab-platform:8910
  BOOTSTRAP_HYDOPS_URL: http://hydops-api:8800
  PUBLIC_PLATFORM_URL: http://localhost:8910
  PUBLIC_HYDOPS_URL: http://localhost:8800
  FABRIC_PG_HOST: postgres
  FABRIC_PG_PORT: '5432'
  HYDOPS_AGENT_MODE: offline
  ORCHESTRATION: platform
  SPEED: '1'
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: hydops, POSTGRES_PASSWORD: hydops, POSTGRES_DB: hydops}
    ports: ['127.0.0.1:55432:5432']
    volumes: ['./sql:/docker-entrypoint-initdb.d:ro', 'pg:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U hydops'], interval: 5s, retries: 24}
  neo4j:
    image: neo4j:5
    environment: {NEO4J_AUTH: neo4j/hydops-lecture}
    ports: ['127.0.0.1:57474:7474', '127.0.0.1:57687:7687']
    volumes: ['graph:/data']
    healthcheck: {test: ['CMD-SHELL', 'wget -qO- http://localhost:7474 || exit 1'], interval: 5s, retries: 36}
  hydops-api:
    build: .
    image: knu-hydops-local:development
    command: ['uvicorn', 'hydops.b9_dashboard.app:app', '--host', '0.0.0.0', '--port', '8800']
    environment: *runtime
    ports: ['127.0.0.1:8800:8800']
    depends_on: {postgres: {condition: service_healthy}, neo4j: {condition: service_healthy}}
  lab-platform:
    build: .
    image: knu-hydops-local:development
    command: ['uvicorn', 'labplatform.main:app', '--host', '0.0.0.0', '--port', '8910']
    environment: *runtime
    ports: ['127.0.0.1:8910:8910']
    volumes: ['apps:/app/labplatform/data/apps']
    depends_on: {postgres: {condition: service_healthy}, neo4j: {condition: service_healthy}}
volumes:
  pg: {}
  graph: {}
  apps: {}
